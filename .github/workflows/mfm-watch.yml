name: MFM watch

# Checks mfm.warhammer-community.com weekly for detachment DP / Force Disposition
# (and unit/codex) changes. On a change it refreshes the snapshot, re-syncs
# src/lib/data.ts FACTIONS from it, deprecates affected codexes, commits both
# files (Vercel then auto-deploys), and opens an issue describing the change.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # FIREBASE_BOT_* live in the "Production" environment, not as repo secrets —
    # the job must declare the environment or they aren't injected (which
    # silently skipped the library deprecation write).
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Needed so sync-data-ts.mjs can run `npx tsc` to read/verify data.ts.
      - name: Install deps
        run: npm ci

      - name: Check MFM for changes
        run: node scripts/mfm-check.mjs
        env:
          FIREBASE_BOT_EMAIL: ${{ secrets.FIREBASE_BOT_EMAIL }}
          FIREBASE_BOT_PASSWORD: ${{ secrets.FIREBASE_BOT_PASSWORD }}

      # Close the loop: regenerate data.ts FACTIONS from the refreshed snapshot so
      # the app actually picks up the change. No-op when already in sync; reverts
      # itself if the regenerated file fails to type-check.
      - name: Sync data.ts from the snapshot
        run: node scripts/sync-data-ts.mjs

      - name: Commit snapshot + data.ts if they changed
        id: snap
        run: |
          if git diff --quiet -- mfm-snapshot.json src/lib/data.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "mfm-watch"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mfm-snapshot.json src/lib/data.ts
            git commit -m "MFM update: refresh snapshot + re-sync data.ts ($(date +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue describing the change
        if: steps.snap.outputs.changed == 'true'
        run: gh issue create --title "MFM update detected ($(date +%F))" --body-file mfm-changes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
